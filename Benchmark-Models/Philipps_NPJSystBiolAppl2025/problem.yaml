format_version: 2.0.0
model_files:
  model:
    location: model.xml
    language: sbml
parameter_files:
  - parameters.tsv
measurement_files:
  - measurements.tsv
observable_files:
  - observables.tsv
mapping_files:
  - mappings.tsv
extensions:
  sciml:
    version: 0.1.0
    required: true
    neural_networks:
      net1:
        location: nn_model_net1.yaml
        format: yaml
        pre_initialization: false
    hybridization_files:
      - hybridizations.tsv
    array_files:
      - parameters_net1.hdf5
